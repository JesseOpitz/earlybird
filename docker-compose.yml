version: '3.8'

services:
  web:
    image: my_web_image
    build:
      context: ./web
    ports:
      - '8080:8080'
    depends_on:
      - db
      - redis

  api:
    image: my_api_image
    build:
      context: ./api
    ports:
      - '8000:8000'
    depends_on:
      - db
      - redis

  worker:
    image: my_worker_image
    build:
      context: ./worker
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'